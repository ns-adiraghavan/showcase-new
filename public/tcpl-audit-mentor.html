const FALLBACK={lead:"That's outside the corpus loaded for this demonstration build.",
  why:"This build carries a slice of the TCPL corpus. A production build would carry the full methodology and every audit programme. Either way, when no loaded source supports an answer, the mentor says so rather than making one up.",
  consider:["A production build answers from the complete corpus, so refusals become rarer and point to genuine gaps in the methodology.","Every refusal is logged. Repeated refusals on one theme tell the audit team what the methodology does not yet cover."],
  askNext:["Start typing and suggestions will appear, or open the Prompt library tab for everything loaded"],sources:[],fups:["scopeclaims","claimvalidity","jargon"]};
const ansFor=k=>k?(D[k].byRole[st.role]||D[k].byRole.both):FALLBACK;
const roleSpecific=k=>k&&!D[k].byRole.both;

/* ================= matching ================= */
function score(q,k){const n=q.toLowerCase();let s=0;for(const kw of D[k].keys)if(n.includes(kw))s+=kw.length+4;
  const a=D[k].ask.toLowerCase();for(const w of n.split(/\s+/))if(w.length>3&&a.includes(w))s+=2;return s}
function best(q){if(!q.trim())return null;let b=null,bs=0;for(const k of Object.keys(D)){const s=score(q,k);if(s>bs){bs=s;b=k}}return bs>=6?b:null}
function suggest(q){const t=q.trim();if(t.length<2)return[];return Object.keys(D).map(k=>({k,s:score(t,k)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,5).map(x=>x.k)}
function hl(text,q){const ws=q.toLowerCase().split(/\s+/).filter(w=>w.length>2).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  if(!ws.length)return esc(text);return esc(text).replace(new RegExp("("+ws.join("|")+")","ig"),"<mark>$1</mark>")}

/* ================= actions ================= */
function ask(text,key,ctx){
  st.msgs.push({side:"u",text,at:now(),ctx});st.typing=true;render();
  const fast=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(()=>{st.typing=false;st.msgs.push({side:"b",key,at:now()});render()},fast?120:850);
}
function askKey(k,ctx){st.tab="chat";st.input="";ask(D[k].ask,k,ctx||D[k].context)}
function send(){const t=st.input.trim();if(!t)return;st.input="";ask(t,best(t))}

/* ================= views ================= */
function cardHTML(a,refuse){
  return `<div class="card${refuse?" refuse":""}">
   <div class="sec"><div class="sk head">${refuse?"Can't answer this":"Answer"}</div><p class="lead">${esc(a.lead)}</p></div>
   <div class="sec"><div class="sk">Why that's the answer</div><p>${esc(a.why)}</p></div>
   <div class="sec"><div class="sk">What else to consider</div><ul>${a.consider.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div>
   <div class="sec"><div class="sk">Questions you didn't ask</div><ul class="ask">${a.askNext.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div>
   <div class="sec"><div class="sk">Sources</div>${a.sources.length?[...a.sources].sort((x,y)=>x.t-y.t).map(s=>`<div class="src"><span class="tier t${s.t}">Tier ${s.t}</span><span>${esc(s.n)} <i>${esc(s.i)}</i></span></div>`).join("")
     :'<p style="color:var(--tx2);font-size:13px">No source in the loaded corpus supports an answer to this question.</p>'}</div></div>`;
}
function vChat(){
  const R=ROLES[st.role];
  let h=`<div class="thr" id="thr"><div class="thr-in">`;
  if(st.ctx&&!st.msgs.length){
    h+=`<div class="ctxban"><div class="av" style="width:28px;height:28px;font-size:13px">M</div><div>Opened from <b>Continuous Controls Monitoring</b> on rule <b>${esc(st.ctx.rule)}</b>${st.ctx.count?", "+esc(st.ctx.count):""}. 
      <div style="margin-top:8px"><button class="chip" id="ctxGo">${st.ctx.exact?"Explain rule "+esc(st.ctx.rule):"See related guidance: "+esc(D[st.ctx.key].ask)}</button></div></div></div>`;
  }
  if(!st.msgs.length){
    const hr=new Date().getHours(),greet=hr<12?"Good morning":hr<17?"Good afternoon":"Good evening";
    h+=`<div class="wel"><h1>${greet}, ${esc(R.who.split(" ")[0])}</h1>
      <p>Ask as you would ask a colleague. I answer from TCPL's methodology, audit programmes and the IIA and ICAI standards, and cite every source. I explain, but I don't form audit opinions.</p>
      ${WELCOME.map(g=>`<div class="grp"><div class="gk">${esc(g.k)}</div><div class="chips">${g.qs.map(k=>`<button class="chip" data-ask="${k}">${esc(D[k].ask)}</button>`).join("")}</div></div>`).join("")}
      <p class="hint">Or type below for suggestions. Answers adjust to your role as ${esc(R.short)}.</p></div>`;
  }
  st.msgs.forEach(m=>{
    if(m.side==="u") h+=`<div class="row me"><div class="col">${m.ctx?`<div class="quote">From Continuous Controls Monitoring, rule ${esc(m.ctx.rule)}, ${esc(m.ctx.count||"")}</div>`:""}<div class="bub">${esc(m.text)}</div><div class="bub-t">${m.at}</div></div></div>`;
    else{const a=ansFor(m.key),ref=m.key&&D[m.key].refuse;
      h+=`<div class="row"><div class="av" aria-hidden="true">M</div><div class="col" style="flex:1"><div class="nm"><b>Audit Mentor</b><i>${m.at}</i>${roleSpecific(m.key)?`<span class="rolepill">Pitched for ${esc(R.short)}</span>`:""}</div>
        ${cardHTML(a,ref)}<div class="acts">${a.fups.filter(k=>D[k]).map(k=>`<button class="act" data-ask="${k}">${esc(D[k].ask)}</button>`).join("")}</div></div></div>`;}
  });
  if(st.typing) h+=`<div class="row"><div class="av" aria-hidden="true">M</div><div class="col"><div class="nm"><b>Audit Mentor</b><i>now</i></div><div class="typ" aria-label="Mentor is typing"><i></i><i></i><i></i></div></div></div>`;
  h+=`<div id="end"></div></div></div>`;
  const sug=st.sugOn?suggest(st.input):[];
  if(st.sugIdx>=sug.length) st.sugIdx=0;
  h+=`<div class="cmp"><div class="cmp-in">
    ${sug.length?`<div class="sug" role="listbox"><div class="sug-h">Suggested questions. Tab to complete, Enter to ask.</div>${sug.map((k,i)=>`<button class="sug-i${i===st.sugIdx?" on":""}" data-sug="${k}" role="option"><span class="sug-q">${hl(D[k].ask,st.input)}</span><span class="sug-s">${esc(D[k].stage||"Guard rail")}</span></button>`).join("")}</div>`:""}
    <div class="cbox"><input id="inp" value="${esc(st.input)}" placeholder="Ask the mentor a question" aria-label="Ask the mentor a question" autocomplete="off">
      <button class="send${st.input.trim()?" hot":""}" id="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 12 20 4l-4 8 4 8-16-8z"/></svg></button></div>
    <div class="foot"><span>Answers cite their source.</span>${st.msgs.length?'<button id="clear">Clear conversation</button>':""}</div></div></div>`;
  return h;
}
function vLibrary(){
  return `<div class="body"><div class="body-in"><h2 class="pg-h">Prompt library</h2>
   <p class="pg-s">${Object.keys(D).length} questions for the TCPL audit lifecycle. Select one to ask it. Rule numbers match Continuous Controls Monitoring.</p>
   ${STAGES.map(s=>{const ks=Object.keys(D).filter(k=>D[k].stage===s);return ks.length?`<div style="margin-top:24px"><div class="gk">${esc(s)}</div><div class="lib">${ks.map(k=>`<button class="lib-row" data-ask="${k}"><div style="min-width:0"><div class="lib-q">${esc(D[k].ask)}${D[k].context?`<span class="rtag">${esc(D[k].context.rule)}</span>`:""}</div><div class="lib-d">${esc(D[k].blurb)}${roleSpecific(k)?" Answer differs by role.":""}</div></div><span class="lib-go">Ask</span></button>`).join("")}</div></div>`:""}).join("")}
   <div class="note">Prompts for doing work are kept in a separate, reviewed library. This app is for understanding the work, not producing it.</div></div></div>`;
}
function vSources(){
  return `<div class="body"><div class="body-in"><h2 class="pg-h">Sources</h2>
   <p class="pg-s">Everything the mentor can answer from, and the order of authority between them. Nothing outside this list is reachable.</p>
   ${SOURCE_TIERS.map(t=>`<div class="tierhead"><h3>${esc(t.label)}</h3></div><p class="pg-s" style="margin-top:4px">${esc(t.note)}</p>
     <div class="tblw"><table class="st"><thead><tr><th>Document</th><th>Owner</th><th>Effective</th><th>Indexed</th></tr></thead><tbody>
     ${t.docs.map(d=>`<tr><td><div style="font-weight:600">${esc(d[0])}</div><div class="meta">Version ${esc(d[1])}</div></td><td>${esc(d[3])}</td><td style="white-space:nowrap">${esc(d[2])}</td>
       <td>${d[4]?`<span class="pill idx">${d[4]} sections</span>`:'<span class="pill exc">Not yet indexed</span>'}</td></tr>`).join("")}</tbody></table></div>`).join("")}
   <div class="tierhead"><h3>Deliberately not loaded</h3></div><p class="pg-s" style="margin-top:4px">Questions touching these get a refusal, not an answer.</p>
   <div class="tblw"><table class="st"><thead><tr><th>Source</th><th>Reason</th></tr></thead><tbody>${NOT_LOADED.map(n=>`<tr><td style="font-weight:600">${esc(n[0])}</td><td>${esc(n[1])}</td></tr>`).join("")}</tbody></table></div>
   <div class="note">Every source carries a version and an effective date, so an answer given in May can be reconstructed in November after the methodology has changed. Internal Audit approves every change to a Tier 2 source.</div></div></div>`;
}
function vAbout(){
  return `<div class="body"><div class="body-in"><h2 class="pg-h">About Audit Mentor</h2>
   <p class="pg-s">A learning tool for Tata Consumer's internal audit team. It explains TCPL methodology and the standards behind it, pitched to who is asking. It runs inside Microsoft Teams, alongside tools the team already uses.</p>
   <div class="ab"><h3>How an answer is built</h3><div class="flow">
     <div class="fl"><b>1. Retrieve</b><span>Keyword and meaning search across the indexed corpus, together</span></div>
     <div class="fl"><b>2. Rank</b><span>Higher-authority sources win where sources disagree</span></div>
     <div class="fl"><b>3. Compose</b><span>A fixed five-part structure, pitched to the role from Entra</span></div>
     <div class="fl"><b>4. Cite</b><span>Every claim traces to a source, or the answer is refused</span></div></div></div>
   <div class="ab"><h3>What it won't do</h3><ul>
     <li><b>Form an audit opinion.</b> It won't say whether a control passed or failed, or whether something is a finding. That conclusion is the auditor's and carries their name.</li>
     <li><b>Answer from outside the corpus.</b> It can't reach the open web. If no loaded source supports an answer, it says so.</li>
     <li><b>Flatter.</b> It critiques work against the standard and won't call work good just to encourage.</li>
     <li><b>Do the work.</b> It explains how to build a finding. It doesn't draft one.</li></ul></div>
   <div class="ab"><h3>Governance</h3><ul>
     <li>Every source is versioned and effective-dated. Internal Audit approves changes to its own documents.</li>
     <li>Every question, the sources retrieved, the corpus version and the answer are logged, so any answer can be reconstructed later.</li>
     <li>A fixed evaluation set runs on every corpus, prompt or model change, checking retrieval accuracy, citation support, format and correct refusal.</li>
     <li>The model version is pinned. A model change is a governed change, not an automatic upgrade.</li></ul></div>
   <div class="ab"><h3>How it connects to continuous monitoring</h3><ul>
     <li>Every exception in Continuous Controls Monitoring carries a rule ID. "Explain this control" opens the mentor with that rule already in context.</li>
     <li>The rules find the exception. The mentor explains what the control exists to catch. The auditor decides what it means.</li></ul></div></div></div>`;
}

/* ================= render ================= */
let focusInput=false;
function render(){
  const R=ROLES[st.role];
  document.getElementById("whoami").innerHTML=`${esc(R.who)}, <b>${esc(R.title)}</b>`;
  document.getElementById("rav").textContent=R.initials;document.getElementById("rav").title=R.who;
  document.querySelectorAll(".tab").forEach(t=>{const on=t.dataset.tab===st.tab;t.classList.toggle("on",on);t.setAttribute("aria-selected",on)});
  const v=document.getElementById("view");
  v.innerHTML=st.tab==="chat"?vChat():st.tab==="library"?vLibrary():st.tab==="sources"?vSources():vAbout();
  v.querySelectorAll("[data-ask]").forEach(b=>b.onclick=()=>askKey(b.dataset.ask));
  v.querySelectorAll("[data-sug]").forEach(b=>{b.onclick=()=>{st.sugOn=true;askKey(b.dataset.sug)};b.onmouseenter=()=>{st.sugIdx=[...v.querySelectorAll("[data-sug]")].indexOf(b);v.querySelectorAll(".sug-i").forEach((x,i)=>x.classList.toggle("on",i===st.sugIdx))}});
  const cg=document.getElementById("ctxGo");if(cg)cg.onclick=()=>askKey(st.ctx.key,{rule:st.ctx.rule,count:st.ctx.count});
  const clr=document.getElementById("clear");if(clr)clr.onclick=()=>{st.msgs=[];render()};
  const inp=document.getElementById("inp");
  if(inp){
    inp.oninput=e=>{st.input=e.target.value;st.sugOn=true;focusInput=true;const pos=e.target.selectionStart;render();const n=document.getElementById("inp");n.focus();n.setSelectionRange(pos,pos)};
    inp.onkeydown=e=>{const sug=st.sugOn?suggest(st.input):[];
      if(sug.length){
        if(e.key==="ArrowDown"){e.preventDefault();st.sugIdx=(st.sugIdx+1)%sug.length;render();refocus();return}
        if(e.key==="ArrowUp"){e.preventDefault();st.sugIdx=(st.sugIdx-1+sug.length)%sug.length;render();refocus();return}
        if(e.key==="Tab"){e.preventDefault();st.input=D[sug[st.sugIdx]].ask;render();refocus();return}
        if(e.key==="Escape"){st.sugOn=false;render();refocus();return}
        if(e.key==="Enter"){e.preventDefault();askKey(sug[st.sugIdx]);return}}
      if(e.key==="Enter")send()};
    document.getElementById("send").onclick=send;
    if(focusInput){refocus();focusInput=false}
  }
  const rows=document.querySelectorAll("#thr .row");const last=rows[rows.length-1];
  if(last&&st.msgs.length){if(!st.typing&&st.msgs[st.msgs.length-1].side==="b"&&!scrolledFor(st.msgs.length))last.scrollIntoView({block:"start"});else if(st.typing)document.getElementById("end").scrollIntoView({block:"end"})}
}
let lastScrolled=0;function scrolledFor(n){if(lastScrolled===n)return true;lastScrolled=n;return false}
function refocus(){const n=document.getElementById("inp");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{st.tab=t.dataset.tab;render()});
document.getElementById("switchRole").onclick=()=>{st.role=st.role==="junior"?"lead":"junior";st.msgs=[];render()};

/* ================= context from continuous monitoring =================
   The monitoring prototype links here with a hash such as #rule-ts2-1-r1 */
function readHash(){
  const h=(location.hash||"").replace(/^#/,"").toLowerCase();
  const m=h.match(/^rule-([a-z]*)(\d+)-(\d+)-r(\d+)$/);
  if(!m) return null;
  const id=(m[1].toUpperCase()+m[2]+"."+m[3]+"-R"+m[4]);
  let key=RULE_TOPIC[id];
  if(!key){const p=PREFIX_TOPIC.find(x=>m[1].toUpperCase()===x[0]);key=(p||PREFIX_TOPIC[PREFIX_TOPIC.length-1])[1]}
  const exact=D[key].context&&D[key].context.rule===id;
  return {rule:id,key,exact:exact||!!RULE_COUNTS[id],count:exact?D[key].context.count:(RULE_COUNTS[id]||"")};
}
st.ctx=readHash();
window.addEventListener("hashchange",()=>{st.ctx=readHash();st.msgs=[];st.tab="chat";render()});
render();

</script>
</body>
</html>
