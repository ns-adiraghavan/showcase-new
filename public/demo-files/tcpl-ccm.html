<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Continuous Controls Monitoring, Tata Consumer Products</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#042D49;--ink-raised:#0B3A5C;--cyan:#19BED1;--on-ink:#C7D6E2;--on-ink2:#8FA8BC;
  --canvas:#F2F6F8;--surface:#FFFFFF;--panel:#F2F6F8;--head:#F7FAFB;
  --line:#DCE3E8;--line-soft:#E9EEF1;
  --text:#042D49;--muted:#4F5B66;--muted2:#6A7783;
  --accent:#005F86;--accent-soft:#E6F1F6;--accent-line:#B9D6E4;
  --fail:#B3362B;--fail-soft:#FBECEA;--fail-line:#EFC4BE;
  --pass:#1D7350;--pass-soft:#E7F3EC;--pass-line:#BCDCCB;
  --warn:#8C5A00;--warn-soft:#FBF1DE;--warn-line:#E8D2A6;
  --hatch1:#DCE3E8;--hatch2:#F4F7F9;--scrim:rgba(4,45,73,.42);
  --disp:"Open Sans","Segoe UI",Arial,sans-serif;
  --sans:"Manrope","Segoe UI",Arial,sans-serif;
  --r:12px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#031C2E;--ink-raised:#0B2C45;--on-ink:#C7D6E2;--on-ink2:#86A0B5;
    --canvas:#09141D;--surface:#0F1D29;--panel:#142533;--head:#12212E;
    --line:#22384A;--line-soft:#1A2D3C;
    --text:#E4EDF3;--muted:#A9B9C6;--muted2:#8698A7;
    --accent:#5CC3DE;--accent-soft:#0F2E3E;--accent-line:#1E4C61;
    --fail:#F08A7E;--fail-soft:#3A1A17;--fail-line:#5E2A24;
    --pass:#6FCF9F;--pass-soft:#10301F;--pass-line:#1F5236;
    --warn:#E8B35A;--warn-soft:#33260E;--warn-line:#5A4318;
    --hatch1:#22384A;--hatch2:#142533;--scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#031C2E;--ink-raised:#0B2C45;--on-ink:#C7D6E2;--on-ink2:#86A0B5;
  --canvas:#09141D;--surface:#0F1D29;--panel:#142533;--head:#12212E;
  --line:#22384A;--line-soft:#1A2D3C;
  --text:#E4EDF3;--muted:#A9B9C6;--muted2:#8698A7;
  --accent:#5CC3DE;--accent-soft:#0F2E3E;--accent-line:#1E4C61;
  --fail:#F08A7E;--fail-soft:#3A1A17;--fail-line:#5E2A24;
  --pass:#6FCF9F;--pass-soft:#10301F;--pass-line:#1F5236;
  --warn:#E8B35A;--warn-soft:#33260E;--warn-line:#5A4318;
  --hatch1:#22384A;--hatch2:#142533;--scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--sans);background:var(--canvas);color:var(--text);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
img{max-width:100%}

.sample{background:var(--ink);color:var(--on-ink2);font-size:11.5px;padding:7px 18px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08)}
.shell{display:flex;min-height:100%;background:linear-gradient(to right,var(--ink) 232px,transparent 232px)}
.nav{width:232px;flex:0 0 232px;background:var(--ink);color:var(--on-ink);display:flex;flex-direction:column;position:sticky;top:0;align-self:flex-start;height:100vh;height:100dvh}
.mark{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.09);text-align:left;width:100%;display:block}
.mark img{width:132px;height:auto;display:block}
.mark-s{display:block;margin-top:10px;font-size:12px;color:var(--on-ink2);font-weight:500}
.client{margin:14px 12px 4px;padding:12px 12px;border-radius:10px;background:var(--ink-raised)}
.client .c1{font-family:var(--disp);font-weight:700;color:#fff;font-size:13.5px;line-height:1.3}
.client .c2{font-size:11.5px;color:var(--on-ink2);margin-top:3px}
.nav nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px}
.nav nav button{text-align:left;padding:10px 12px;border-radius:8px;color:var(--on-ink);line-height:1.25;font-weight:500;position:relative}
.nav nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav nav button[aria-current="true"]{background:rgba(255,255,255,.09);color:#fff;font-weight:700}
.nav nav button[aria-current="true"]::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--cyan)}
.persona{margin:10px 12px 0;padding:12px;border:1px solid rgba(255,255,255,.12);border-radius:10px}
.persona .h{font-size:11.5px;color:var(--on-ink2);margin-bottom:8px;font-weight:600}
.persona button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:6px;font-size:12.5px;color:var(--on-ink);line-height:1.3}
.persona button:hover{background:rgba(255,255,255,.06);color:#fff}
.persona button[aria-pressed="true"]{background:var(--cyan);color:#042D49;font-weight:700}
.nav-foot{margin-top:auto;padding:14px 20px 18px;border-top:1px solid rgba(255,255,255,.09);font-size:11.5px;color:var(--on-ink2);line-height:1.55}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.asbar{background:var(--surface);border-bottom:1px solid var(--line);padding:13px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.asbar .t{font-family:var(--disp);font-size:18px;font-weight:700;letter-spacing:-.01em}
.live{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--pass);background:var(--pass-soft);border:1px solid var(--pass-line);padding:4px 11px;border-radius:20px}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.filters{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 26px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters .lbl{font-size:12px;font-weight:600;color:var(--muted2);margin-left:4px}
select,input{font-family:inherit;font-size:12.5px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text)}
.clearall{font-size:12px;font-weight:600;color:var(--accent);border:1px solid var(--accent-line);background:var(--accent-soft);padding:7px 11px;border-radius:8px}
.content{padding:26px;flex:1}
.kicker{font-size:12.5px;font-weight:700;color:var(--accent)}
.h1{font-family:var(--disp);font-weight:800;font-size:clamp(34px,4.6vw,52px);line-height:1.04;letter-spacing:-.025em;margin:10px 0 0}
.h2{font-family:var(--disp);font-weight:700;font-size:25px;letter-spacing:-.015em;margin:6px 0 0;line-height:1.2}
.sub{color:var(--muted);margin-top:10px;max-width:72ch;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{padding:14px 17px;border-bottom:1px solid var(--line-soft);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card-h h3{margin:0;font-family:var(--disp);font-size:14.5px;font-weight:700}
.card-h .s{font-size:12px;color:var(--muted2)}
.card-b{padding:17px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1060px){.g2,.g21,.g3{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:20px}
@media(max-width:1180px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px}
.stat-k{font-size:12px;font-weight:600;color:var(--muted)}
.stat-v{font-family:var(--disp);font-weight:800;font-size:28px;margin-top:4px;letter-spacing:-.02em}
.stat-v.pass{color:var(--pass)}.stat-v.fail{color:var(--fail)}.stat-v.acc{color:var(--accent)}
.stat-n{font-size:12px;color:var(--muted2);margin-top:2px}

.rail-track{position:relative;height:var(--h,10px);width:100%;background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.rail-fill{position:absolute;inset:0 auto 0 0;display:flex}
.rail-pass{background:var(--pass)}.rail-fail{background:var(--fail)}
.rail-untested{position:absolute;inset:0 0 0 auto;background-image:repeating-linear-gradient(45deg,var(--hatch1) 0 4px,var(--hatch2) 4px 8px)}
.rail-cap{display:flex;justify-content:space-between;gap:12px;margin-top:7px;font-size:12px;color:var(--muted2)}
.rail-cap b{color:var(--text);font-weight:700}

table{width:100%;border-collapse:collapse}
.tbl-wrap{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden}
.tbl-scroll{overflow-x:auto}
th{background:var(--head);text-align:left;padding:10px 13px;font-size:12px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 13px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}tr.click:hover{background:var(--accent-soft)}
tr.click:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
tr.grp td{background:var(--panel);font-size:12px;font-weight:700;color:var(--muted);padding:8px 13px}
.num{text-align:right;white-space:nowrap}
.dim{color:var(--muted)}.dim2{color:var(--muted2)}.small{font-size:12px}
.rid{color:var(--accent);font-weight:700;white-space:nowrap}
.tcell b{font-weight:700}
.tcell .n{font-size:12px;color:var(--muted2);margin-top:1px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:2px 9px;border:1px solid;border-radius:20px;white-space:nowrap;line-height:1.6}
.chip.ok{color:var(--pass);border-color:var(--pass-line);background:var(--pass-soft)}
.chip.no{color:var(--fail);border-color:var(--fail-line);background:var(--fail-soft)}
.chip.hi{color:var(--fail);border-color:var(--fail-line)}
.chip.me{color:var(--warn);border-color:var(--warn-line)}
.chip.lo{color:var(--muted);border-color:var(--line)}
.chip.open{color:var(--fail);border-color:var(--fail-line);background:var(--fail-soft)}
.chip.assigned{color:var(--warn);border-color:var(--warn-line);background:var(--warn-soft)}
.chip.responded{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.chip.closed{color:var(--pass);border-color:var(--pass-line);background:var(--pass-soft)}
.chip.biz{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.chip.ia{color:var(--muted);border-color:var(--line);background:var(--panel)}
.tgo{display:inline-block;font-size:10.5px;font-weight:700;color:var(--accent);border:1px dashed var(--accent-line);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px;white-space:nowrap}

.btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--disp);font-weight:700;font-size:13.5px;padding:12px 22px;border-radius:8px;background:var(--accent);color:#fff;border:1px solid var(--accent)}
:root[data-theme="dark"] .btn{color:#042D49}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#042D49}}
.btn:hover{filter:brightness(1.08)}
.btn.plain{background:var(--surface);border-color:var(--line);color:var(--text)}
.btn.sm{padding:9px 16px;font-size:12.5px}
.linkbtn{color:var(--accent);font-weight:700;font-size:12.5px}
.foot{border-top:1px solid var(--line);margin-top:26px;padding:14px 0 6px;font-size:12px;color:var(--muted2);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.rule-box{background:var(--accent-soft);border:1px solid var(--accent-line);border-left:3px solid var(--accent);border-radius:8px;padding:13px 16px;line-height:1.55}
.rule-box .h{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:5px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-row .nm{flex:0 0 200px;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:14px;background:var(--panel);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent)}.bar-fill.warn{background:var(--fail)}
.bar-row .vv{width:38px;text-align:right;font-size:12px;color:var(--muted)}
@media(max-width:560px){.bar-row .nm{flex-basis:120px}}

.ink{background:var(--ink);color:var(--on-ink);border-radius:var(--r);padding:22px}
.ink h3{margin:0;font-family:var(--disp);font-size:16px;color:#fff;font-weight:700}
.ink .p{font-size:12.5px;color:var(--on-ink2);margin-top:5px}
.recon-bar{display:flex;height:36px;border-radius:6px;overflow:hidden;margin-top:16px;border:1px solid rgba(255,255,255,.12)}
.recon-bar div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;padding:0 8px}
.recon-bar .t{background:#0F5E86;color:#fff}.recon-bar .s{background:#7A5A12;color:#fff}
.recon-legend{display:flex;gap:30px;margin-top:16px;flex-wrap:wrap}
.recon-legend div{font-size:12px;color:var(--on-ink2);font-weight:600}
.recon-legend b{display:block;font-family:var(--disp);color:#fff;font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.recon-legend .cy b{color:var(--cyan)}
.logline{font-size:12px;padding:7px 0;border-bottom:1px dashed var(--line-soft);display:flex;gap:12px}
.logline .ts{color:var(--muted2);flex:0 0 74px}
.logline .rs{flex:0 0 52px;font-weight:700}
.logline .rs.p{color:var(--pass)}.logline .rs.w{color:var(--warn)}

.scrim{position:fixed;inset:0;background:var(--scrim);display:none;z-index:4}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:500px;max-width:94vw;background:var(--surface);transform:translateX(102%);transition:transform .2s ease;display:flex;flex-direction:column;z-index:5;box-shadow:-10px 0 34px rgba(4,45,73,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden}
.drawer.on{transform:translateX(0);visibility:visible}
.d-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.d-head h3{margin:0;font-family:var(--disp);font-size:17px;font-weight:700;line-height:1.25}
.d-head .x{margin-left:auto;border:1px solid var(--line);border-radius:8px;width:30px;height:30px;color:var(--muted);flex:none;font-size:18px;line-height:1}
.d-body{padding:19px;overflow-y:auto;flex:1}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:7px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.d-sec{margin-top:20px;padding-top:16px;border-top:1px solid var(--line-soft)}
.d-sec h4{margin:0 0 10px;font-size:12.5px;font-weight:700;color:var(--muted)}
.field{margin-bottom:11px}.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field select,.field input{width:100%}
.trail div{padding:8px 0;border-bottom:1px dashed var(--line-soft);font-size:12.5px}
.trail .w{font-size:12px;color:var(--muted2)}
.note{color:var(--muted);line-height:1.6}
.msg{font-size:12.5px;margin-top:10px;font-weight:600}
.mentor{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.mentor .ic{flex:none;width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--cyan);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:13px}
.step.old{border-left:3px solid var(--muted2)}.step.new{border-left:3px solid var(--pass)}
.step .who{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:3px}
.hidden{display:none}

.hero{max-width:1180px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:34px;align-items:start;margin-top:8px}
@media(max-width:1060px){.hero-grid{grid-template-columns:1fr}}
.cmp{background:var(--ink);border-radius:16px;padding:24px 24px 20px;color:var(--on-ink)}
.cmp h3{margin:0 0 4px;font-family:var(--disp);color:#fff;font-size:15px;font-weight:700}
.cmp .p{font-size:12.5px;color:var(--on-ink2)}
.cmp-row{margin-top:22px}
.cmp-lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:600;color:var(--on-ink);margin-bottom:8px;gap:12px}
.cmp-lbl .v{font-family:var(--disp);font-size:30px;font-weight:800;letter-spacing:-.02em;color:#fff}
.cmp-row.b .v{color:var(--cyan)}
.cmp .rail-track{background:#0B3A5C;border-color:rgba(255,255,255,.12)}
.cmp .rail-untested{background-image:repeating-linear-gradient(45deg,#14476B 0 4px,#0B3A5C 4px 8px)}
.cmp .rail-pass{background:#3FA37A}.cmp .rail-fail{background:#E0796D}
.cmp .rail-cap{color:var(--on-ink2)}
.pop{margin-top:22px;border-top:1px solid rgba(255,255,255,.12);padding-top:14px}
.pop-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,.06)}
.pop-row:last-child{border-bottom:none}
.pop-row b{color:#fff;font-weight:700}
.basis{margin-top:22px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:700px){.basis{grid-template-columns:1fr}}
.basis div{border-top:2px solid var(--accent);padding-top:10px;font-size:13px;color:var(--muted)}
.basis b{display:block;color:var(--text);font-family:var(--disp);font-size:14px;margin-bottom:3px}
.summary{font-size:14px;line-height:1.65;max-width:80ch}
.summary b{font-weight:700}

@media(max-width:860px){
  .shell{flex-direction:column;background:none}
  .nav{width:auto;flex:none;height:auto;position:static}
  .mark{display:flex;align-items:center;gap:12px;padding:14px 16px}
  .mark-s{margin-top:0}
  .client{display:none}
  .nav nav{flex-direction:row;overflow-x:auto;padding:8px}
  .nav nav button{white-space:nowrap}
  .nav nav button[aria-current="true"]::before{left:12px;right:12px;top:auto;bottom:2px;width:auto;height:3px}
  .persona{display:flex;align-items:center;gap:6px;margin:0 8px 10px;padding:6px}
  .persona .h{margin:0 6px 0 4px}
  .persona button{width:auto}
  .nav-foot{display:none}
  .content,.asbar,.filters{padding-left:16px;padding-right:16px}
  .kv{grid-template-columns:120px minmax(0,1fr)}
}
</style>
</head>
<body>
<div class="shell">

    const pool=area.divs, tot=pool.reduce((x,d)=>x+divById(d).w,0);
    let t=r()*tot, div=pool[0];
    for(const d of pool){t-=divById(d).w; if(t<=0){div=d;break}}
    const roll=r();
    const sev=rule.sev==="High"?(roll>.22?"High":"Medium"):rule.sev==="Medium"?(roll>.7?"High":roll>.2?"Medium":"Low"):(roll>.82?"Medium":"Low");
    FIRSTVAL=null;
    const cells=shape.g.map(k=>cell(k,r,div));
    const fv=FIRSTVAL;
    const sr=r();
    const status=sr<.48?"Open":sr<.7?"Assigned":sr<.87?"Responded":"Closed";
    const owner=status==="Open"?(rule.mon==="biz"?rule.own:""):(rule.own||OWNERS[AREA_OWNER[areaId]]);
    const age=1+Math.floor(r()*84);
    out.push({key:key+"|"+i,ref:rule.id+"-"+pad(i+1,3),ruleId:rule.id,ruleD:rule.d,tgo:rule.tgo,areaId,div,
      subName:sub.name,shape:sub.shape,cells,mon:rule.mon,
      finding:pick(finds,r),sev,age,
      value:fv!==null?fv:Math.round((.3+r()*36)*100000),status,owner,due:status==="Open"?"":"12 Nov 2026",
      trail:status==="Open"?[]:status==="Assigned"?[["24 Oct 2026","Assigned for explanation"]]:
        status==="Responded"?[["20 Oct 2026","Assigned for explanation"],["27 Oct 2026","Process owner responded, awaiting audit review"]]:
        [["09 Oct 2026","Assigned for explanation"],["15 Oct 2026","Process owner responded"],["21 Oct 2026","Closed by audit, corrective action agreed"]]});
  }
  POOL[key]=out;return out;
}
let ALL=null;
function allRows(){
  if(ALL) return ALL;
  ALL=[];
  AREAS.forEach(a=>RULES[a.id].filter(r=>r.failed>0).forEach(r=>ALL.push(...rowsFor(a.id,r))));

}

/* On the control status overview, Result and Severity filter the rules themselves */
const onOverview=()=>S.view==="status"&&!S.rule;
function ruleVisible(a,r,sh){
  if(S.persona==="biz"&&r.mon!=="biz") return false;
  if(S.area===a.id&&S.sub&&r.sub!==S.sub) return false;
  if(!onOverview()) return true;
  if(S.sev!=="All"&&r.sev!==S.sev) return false;
  if(S.result==="Clean"&&r.failed*sh>=.5) return false;
  if(S.result==="With exceptions"&&r.failed*sh<.5) return false;
  return true;
}
const ruleOf=row=>RULES[row.areaId].find(x=>x.id===row.ruleId);
function scopedRows(){
  let rows=allRows();
  if(S.div) rows=rows.filter(r=>r.div===S.div);
  if(S.area) rows=rows.filter(r=>r.areaId===S.area);
  if(S.sub) rows=rows.filter(r=>ruleOf(r).sub===S.sub);
  if(S.persona==="biz") rows=rows.filter(r=>r.mon==="biz");
  if(S.status!=="All") rows=rows.filter(r=>r.status===S.status);
  if(S.sev!=="All") rows=rows.filter(r=>r.sev===S.sev);
  return rows;
}
function areaAgg(a,divId){
  const sh=share(a,divId);
  const rs=RULES[a.id].filter(r=>ruleVisible(a,r,sh));
  const subs=SUBS[a.id].filter(s=>!(S.area===a.id&&S.sub)||s.id===S.sub);
  return {controls:rs.length,
    ok:rs.filter(r=>r.failed*sh<.5).length,
    tested:subs.reduce((x,s)=>x+s.population-s.skip,0)*sh,
    ex:rs.reduce((x,r)=>x+r.failed,0)*sh,
    biz:rs.filter(r=>r.mon==="biz").length,
    tgo:rs.filter(r=>r.tgo).length};
}
const areaCadence=a=>{const c=[...new Set(SUBS[a.id].map(s=>s.cadence))];return c.length===1?c[0]:c[0]+", "+c.slice(1).join(", ").toLowerCase()};
const areaLast=a=>SUBS[a.id].map(s=>s.last).find(x=>x.startsWith(RUN))||SUBS[a.id][0].last;
const allRules=()=>AREAS.reduce((x,a)=>x+RULES[a.id].length,0);
const tgoRules=()=>AREAS.reduce((x,a)=>x+RULES[a.id].filter(r=>r.tgo).length,0);

function rail({tested,total,failed,h=10,cap=true,left,right}){
  const cov=total>0?(tested/total)*100:0, fp=tested>0?(failed/tested)*cov:0, pp=cov-fp;
  return `<div><div class="rail-track" style="--h:${h}px" role="img" aria-label="${cov.toFixed(0)} % tested, ${nf(failed)} exceptions">
    <div class="rail-fill" style="width:${cov}%"><div class="rail-pass" style="width:${cov?(pp/cov)*100:0}%"></div><div class="rail-fail" style="width:${cov?Math.max(fp/cov*100,failed>0?.6:0):0}%"></div></div>
    ${cov<100?`<div class="rail-untested" style="width:${100-cov}%"></div>`:""}</div>
    ${cap?`<div class="rail-cap"><span>${left||"<b>"+cov.toFixed(0)+" %</b> tested"}</span><span>${right||"<b>"+nf(failed)+"</b> exceptions of "+nf(tested)}</span></div>`:""}</div>`;
}
const sevChip=v=>`<span class="chip ${v==="High"?"hi":v==="Medium"?"me":"lo"}"><span class="dot"></span>${v}</span>`;
const okChip=ok=>`<span class="chip ${ok?"ok":"no"}"><span class="dot"></span>${ok?"Clean":"Exceptions"}</span>`;

    SUBS[a.id].filter(s=>!S.sub||!S.area||s.id===S.sub).forEach(s=>{
      const rs=RULES[a.id].filter(r=>r.sub===s.id);
      logs.push({last:s.last,code:a.code+"-"+s.id,name:s.name,src:s.population*sh,skip:s.skip*sh,why:s.why,rules:rs.length,tgo:rs.filter(r=>r.tgo).length,ex:rs.reduce((x,r)=>x+r.failed,0)*sh,cad:s.cadence});});
  });
  const total=logs.reduce((x,l)=>x+l.src,0), skip=logs.reduce((x,l)=>x+l.skip,0), ex=logs.reduce((x,l)=>x+l.ex,0), tested=total-skip;
  const skipped=logs.filter(l=>l.skip>0);
  const tp=total?tested/total*100:100;
  return `<div class="kicker">Evidence</div><h2 class="h2">Run and evidence log</h2>
  <p class="sub">What ran, when, over how many records, and how that count reconciles to the source system. Anything not tested is shown with its reason, not hidden.</p>
  <div class="ink" style="margin-top:20px">
    <h3>Population reconciliation, last completed run</h3>
    <div class="p">Records in SAP S/4HANA, MAVIC and SAP EWM against records put through a rule${S.div?", "+esc(divById(S.div).name)+" only":""}</div>
    <div class="recon-bar"><div class="t" style="flex:${Math.max(tp,1)}">${nf(tested)} tested</div>${skip>0?`<div class="s" style="flex:${Math.max(100-tp,14)}">${nf(skip)} skipped</div>`:""}</div>
    <div class="recon-legend">
      <div>In source at run time<b>${nf(total)}</b></div><div class="cy">Put through a rule<b>${nf(tested)}</b></div>
      <div>Skipped, with reason<b>${nf(skip)}</b></div><div>Exceptions raised<b>${nf(ex)}</b></div></div></div>
  ${skipped.length?`<div class="card" style="margin-top:14px"><div class="card-h"><h3>Records not tested on this run</h3><span class="s">Each one has a reason and a next step</span></div>
    <div class="tbl-scroll"><table><thead><tr><th>Sub-process</th><th class="num">Skipped</th><th>Reason and next step</th></tr></thead><tbody>
    ${skipped.map(l=>`<tr><td><span class="rid">${l.code}</span> ${esc(l.name)}</td><td class="num" style="color:var(--warn)">${nf(l.skip)}</td><td>${esc(l.why)}</td></tr>`).join("")}</tbody></table></div></div>`:""}
  <div class="grid g21" style="margin-top:14px">
    <div class="tbl-wrap"><div class="tbl-scroll"><table>
      <thead><tr><th>Last run</th><th>Sub-process</th><th>Cadence</th><th class="num">In source</th><th class="num">Tested</th>
      <th class="num">Rules</th><th class="num">From Tgo</th><th class="num">Exceptions</th></tr></thead>
      <tbody>${logs.map(l=>`<tr><td class="dim small" style="white-space:nowrap">${l.last}</td>
        <td><span class="rid">${l.code}</span> ${esc(l.name)}</td><td class="dim small">${l.cad}</td>
        <td class="num dim">${nf(l.src)}</td><td class="num" style="color:${l.skip?"var(--warn)":"inherit"}">${nf(l.src-l.skip)}</td><td class="num dim">${l.rules}</td>
        <td class="num dim">${l.tgo||""}</td><td class="num" style="color:var(--fail)">${nf(l.ex)}</td></tr>`).join("")}</tbody></table></div></div>
    <div class="card"><div class="card-h"><h3>Why this page exists</h3></div><div class="card-b">
      <div class="note">A tool can show you what it found. It cannot show you what it did not look at, unless every run is logged against the source.</div>
      <div class="note" style="margin-top:10px">Every run records the rule version, date and record count, and ties that count back to S/4HANA or MAVIC. That is what lets a coverage claim stand up before the Audit Committee and the statutory auditor, including through the 2027 auditor transition.</div>
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft)">
        <div class="logline"><span class="ts">03:18:04</span><span class="rs w">Partial</span><span>TRD-2 v4, 186,400 read, 214 skipped</span></div>
        <div class="logline"><span class="ts">03:34:40</span><span class="rs p">Pass</span><span>CSR-1 v2, 28,640 read, 0 skipped</span></div>
        <div class="logline"><span class="ts">04:01:11</span><span class="rs p">Pass</span><span>P2P-6 v3, 212,400 read, 0 skipped</span></div>
        <div class="logline" style="border:0"><span class="ts">04:22:52</span><span class="rs p">Pass</span><span>INV-1 v2, 742,600 read, 0 skipped</span></div>
      </div></div></div></div>`;
}

function vBoard(){
  const rows=scopedRows(), openRows=rows.filter(r=>r.status!=="Closed");
  const byOwner={}; rows.filter(r=>r.owner&&r.status!=="Closed").forEach(r=>byOwner[r.owner]=(byOwner[r.owner]||0)+1);
  const om=Math.max(...Object.values(byOwner),1);
  const ownerBars=Object.entries(byOwner).sort((a,b)=>b[1]-a[1]).slice(0,8).map(o=>
    `<div class="bar-row"><div class="nm" title="${esc(o[0])}">${esc(o[0])}</div><div class="bar-track"><div class="bar-fill ${o[1]>=om?"warn":""}" style="width:${o[1]/om*100}%"></div></div><div class="vv">${o[1]}</div></div>`).join("")||'<div class="dim2">Nothing in scope.</div>';
  const esc7=rows.filter(r=>r.age>21&&r.status!=="Closed").sort((a,b)=>b.age-a.age).slice(0,7);
  const byArea={}; openRows.forEach(r=>byArea[r.areaId]=(byArea[r.areaId]||0)+1);
  const topArea=Object.entries(byArea).sort((a,b)=>b[1]-a[1])[0];
  const highOpen=openRows.filter(r=>r.sev==="High").length, val=openRows.reduce((x,r)=>x+r.value,0);
  let totCtl=0,totEx=0; AREAS.filter(a=>!S.div||a.divs.includes(S.div)).filter(a=>!S.area||a.id===S.area).forEach(a=>{const g=areaAgg(a,S.div);totCtl+=g.controls;totEx+=g.ex});
  const dRows=DIVS.filter(d=>!S.div||d.id===S.div).map(d=>{
    const rs=allRows().filter(r=>r.div===d.id).filter(r=>!S.area||r.areaId===S.area).filter(r=>!S.sub||ruleOf(r).sub===S.sub)
      .filter(r=>S.sev==="All"||r.sev===S.sev).filter(r=>S.status==="All"||r.status===S.status).filter(r=>S.persona!=="biz"||r.mon==="biz");
    const o=rs.filter(r=>r.status==="Open").length,as=rs.filter(r=>r.status==="Assigned").length,
          re=rs.filter(r=>r.status==="Responded").length,cl=rs.filter(r=>r.status==="Closed").length;
    const t=(o+as+re+cl)||1;
    let dc=0,dex=0;
    AREAS.filter(a=>a.divs.includes(d.id)).filter(a=>!S.area||a.id===S.area).forEach(a=>{const g=areaAgg(a,d.id);dc+=g.controls;dex+=g.ex});
    return `<tr ${rowAttrs("data-div",d.id)}><td class="tcell"><b>${esc(d.name)}</b></td><td class="num dim">${dc}</td><td class="num" style="color:var(--fail)">${nf(dex)}</td>
      <td style="min-width:200px;padding-top:14px"><div style="display:flex;height:13px;border-radius:4px;overflow:hidden" role="img" aria-label="${o} open, ${as} assigned, ${re} responded, ${cl} closed">
        <div style="width:${o/t*100}%;background:var(--fail)"></div><div style="width:${as/t*100}%;background:var(--warn)"></div>
        <div style="width:${re/t*100}%;background:var(--accent)"></div><div style="width:${cl/t*100}%;background:var(--pass)"></div></div></td>
      <td class="num dim">${o}</td><td class="num dim">${as}</td><td class="num dim">${re}</td><td class="num dim">${cl}</td></tr>`;}).join("");
  return `<div class="kicker">For the Audit Committee</div><h2 class="h2">Audit Committee view</h2>
  <p class="sub">Position at the last run, who holds open items, and what is past escalation age. Generated from the run, not assembled by hand.</p>
  <div class="card" style="margin-top:18px"><div class="card-h"><h3>Summary for the quarter to date</h3><span class="s">Q3 FY27, October 2026</span></div>
    <div class="card-b summary">${nf(totCtl)} ${S.area?esc(areaById(S.area).name)+" ":""}controls ran last night${S.div?" for "+esc(divById(S.div).name):" across "+DIVS.length+" business units"}, testing the full population of records in each and raising ${nf(totEx)} exceptions. 
    Of the items routed for follow-up, <b>${nf(openRows.length)} are still open</b>, ${highOpen} of them high severity, with ${inr(val)} of transaction value attached. 
    ${esc7.length?"<b>"+rows.filter(r=>r.age>21&&r.status!=="Closed").length+" items are past the 21-day escalation age.</b> ":""}
    ${topArea?"The largest concentration is in "+esc(areaById(topArea[0]).name)+" ("+topArea[1]+" open items).":""}</div></div>
  <div class="tbl-wrap" style="margin-top:14px"><div class="tbl-scroll"><table>
    <thead><tr><th>Business unit</th><th class="num">Controls</th><th class="num">Exceptions</th><th>Status of routed items</th>
    <th class="num">Open</th><th class="num">Assigned</th><th class="num">Responded</th><th class="num">Closed</th></tr></thead>
    <tbody>${dRows}</tbody></table></div>
    <div style="padding:10px 13px;border-top:1px solid var(--line-soft)" class="dim2 small">Bar colours: red open, amber assigned, blue responded, green closed. Counts are shown alongside.</div></div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><div class="card-h"><h3>Open items by process owner</h3></div><div class="card-b">${ownerBars}</div></div>
    <div class="card"><div class="card-h"><h3>Past escalation age</h3><span class="s">Open beyond 21 days</span></div>
      <div class="tbl-scroll"><table><thead><tr><th>Reference</th><th>Finding</th><th class="num">Age</th><th>Owner</th></tr></thead>
      <tbody>${esc7.map(r=>`<tr ${rowAttrs("data-row",r.key)}><td class="rid">${r.ref}</td>
        <td>${esc(r.finding)}</td><td class="num" style="color:var(--fail)">${r.age}d</td>
        <td style="white-space:nowrap">${r.owner?esc(r.owner.split(",")[0]):'<span class="dim2">Not assigned</span>'}</td></tr>`).join("")
        ||'<tr><td colspan="4" class="dim2" style="padding:18px">Nothing past the escalation age in scope.</td></tr>'}</tbody></table></div></div></div>`;
}

function asbar(){
  const b=document.getElementById("asbar");
  if(S.hero){b.style.display="none";return}
  b.style.display="flex";
  b.innerHTML=`<span class="t">Control status at 29 Oct 2026</span>
    <span class="live"><span class="dot"></span>Last run finished today at 04:53. Next run tonight at 02:00.</span>`;
}
function filters(){
  const f=document.getElementById("filters");
  if(S.hero||S.view==="approach"){f.style.display="none";return}
  f.style.display="flex";
  const areaOpts=AREAS.filter(a=>!S.div||a.divs.includes(S.div));
  const subOpts=S.area?SUBS[S.area]:[];
  f.innerHTML=`<label class="lbl" for="fd">Business unit</label><select id="fd"><option value="">All units</option>
      ${DIVS.map(d=>`<option value="${d.id}" ${S.div===d.id?"selected":""}>${esc(d.name)}</option>`).join("")}</select>
    <label class="lbl" for="fa">Control area</label><select id="fa"><option value="">All areas</option>
      ${areaOpts.map(a=>`<option value="${a.id}" ${S.area===a.id?"selected":""}>${esc(a.name)}</option>`).join("")}</select>
    ${subOpts.length?`<label class="lbl" for="fsub">Sub-process</label><select id="fsub"><option value="">All</option>
      ${subOpts.map(s=>`<option value="${s.id}" ${S.sub===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select>`:""}
    ${onOverview()
      ?`<label class="lbl" for="fr">Result</label><select id="fr">${["All","Clean","With exceptions"].map(o=>`<option ${S.result===o?"selected":""}>${o}</option>`).join("")}</select>`
      :S.view!=="coverage"?`<label class="lbl" for="fs">Status</label><select id="fs">${["All","Open","Assigned","Responded","Closed"].map(o=>`<option ${S.status===o?"selected":""}>${o}</option>`).join("")}</select>`:""}
    ${S.view!=="coverage"?`<label class="lbl" for="fv">Severity</label><select id="fv">${["All","High","Medium","Low"].map(o=>`<option ${S.sev===o?"selected":""}>${o}</option>`).join("")}</select>`:""}
    ${(S.div||S.area||S.sub||S.status!=="All"||S.sev!=="All"||S.result!=="All"||S.rule)?'<button class="clearall" id="clr">Clear filters</button>':""}`;
  const g=id=>f.querySelector("#"+id);
  g("fd").onchange=e=>{S.div=e.target.value;if(S.area&&S.div&&!areaById(S.area).divs.includes(S.div)){S.area="";S.sub="";S.rule=null}render()};
  g("fa").onchange=e=>{S.area=e.target.value;S.sub="";S.rule=null;render()};
  if(g("fsub")) g("fsub").onchange=e=>{S.sub=e.target.value;S.rule=null;render()};
  if(g("fr")) g("fr").onchange=e=>{S.result=e.target.value;render()};
  if(g("fs")) g("fs").onchange=e=>{S.status=e.target.value;render()};
  if(g("fv")) g("fv").onchange=e=>{S.sev=e.target.value;render()};
  if(g("clr")) g("clr").onclick=()=>{S.div="";S.area="";S.sub="";S.status="All";S.sev="All";S.result="All";S.rule=null;render()};
}
function bindRow(el,fn){el.onclick=fn;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();fn()}}}
function render(){
  const c=document.getElementById("content");
  asbar(); filters();
  if(S.hero) c.innerHTML=vHero();
  else if(S.view==="status") c.innerHTML=vStatus();
  else if(S.view==="worklist") c.innerHTML=vWorklist();
  else if(S.view==="coverage") c.innerHTML=vCoverage();
  else if(S.view==="board") c.innerHTML=vBoard();
  else c.innerHTML=vApproach();
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",(!S.hero&&b.dataset.view===S.view)?"true":"false"));
  document.querySelectorAll(".persona button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.persona===S.persona?"true":"false"));
  const en=document.getElementById("enter"); if(en) en.onclick=()=>{S.hero=false;S.view="status";render()};
  c.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.hero=false;S.view=b.dataset.go;render()});
  const br=document.getElementById("backRule"); if(br) br.onclick=()=>{S.rule=null;render()};
  c.querySelectorAll("[data-div]").forEach(b=>bindRow(b,()=>{S.div=b.dataset.div;S.rule=null;render()}));
  c.querySelectorAll("[data-area]").forEach(b=>bindRow(b,()=>{S.area=b.dataset.area;S.sub="";S.rule=null;S.view="status";render()}));
  c.querySelectorAll("[data-rule]").forEach(b=>bindRow(b,()=>{S.rule=b.dataset.rule;render();window.scrollTo(0,0)}));
  c.querySelectorAll("[data-row]").forEach(b=>bindRow(b,()=>openDrawer(b.dataset.row)));
}

/* ================= drawer ================= */
let lastFocus=null;
function openDrawer(key){
  const row=allRows().find(x=>x.key===key); if(!row) return;
  lastFocus=document.activeElement;
  const shape=SHAPES[row.shape];
  document.getElementById("dTitle").textContent=row.finding;
  document.getElementById("dRef").textContent=row.ref+", "+divById(row.div).name+", raised "+row.age+" days ago";
  const kv=shape.c.map((c,i)=>`<dt>${esc(c)}</dt><dd>${esc(row.cells[i])}</dd>`).join("");
  const trail=row.trail.length?row.trail.map(t=>`<div><span class="w">${t[0]}</span><br>${esc(t[1])}</div>`).join("")
    :'<div class="dim2">Nothing recorded yet. Assign this item to a process owner to start the trail.</div>';
  document.getElementById("dBody").innerHTML=`
    <div style="display:flex;gap:8px;flex-wrap:wrap">${stChip(row.status)}${sevChip(row.sev)}${monChip(row.mon,row.owner)}
      ${row.age>21&&row.status!=="Closed"?'<span class="chip no"><span class="dot"></span>Past escalation age</span>':""}</div>
    <div class="d-sec"><h4>Control that raised it</h4>
      <div class="rule-box"><div class="h">Rule ${row.ruleId}, ${esc(row.subName)}${row.tgo?", built on a Tgo analytic":""}</div>${esc(row.ruleD)}</div>
      <div class="mentor" style="margin-top:10px"><div class="ic">M</div><div style="min-width:0">
        <a class="linkbtn" id="dMentor" style="text-decoration:none" href="${MENTOR_URL}#rule-${row.ruleId.toLowerCase().replace(".","-")}" target="_blank" rel="noopener">Explain this control in Audit Mentor</a>
        <div class="dim2 small" id="dMentorMsg" style="margin-top:2px">Opens the mentor with rule ${row.ruleId} already in context.</div></div></div></div>
    <div class="d-sec"><h4>Transaction</h4><dl class="kv"><dt>Business unit</dt><dd>${esc(divById(row.div).name)}</dd>${kv}<dt>Value at stake</dt><dd>${inr(row.value)}</dd></dl></div>
    <div class="d-sec"><h4>Route and track</h4>
      <div class="field"><label for="dOwner">Process owner</label><select id="dOwner"><option value="">Select an owner</option>
        ${OWNERS.map(o=>`<option ${o===row.owner?"selected":""}>${esc(o)}</option>`).join("")}</select></div>
      <div class="field"><label for="dDue">Response due by</label><input id="dDue" type="date" value="2026-11-12"></div>
      <div class="field"><label for="dNote">Note to the process owner</label><input id="dNote" placeholder="What needs explaining, and the corrective action expected"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="dAssign">Assign to owner</button>
        <button class="btn plain sm" id="dCloseItem">Close item</button></div>
      <div id="dMsg" class="msg hidden" role="status"></div></div>
    <div class="d-sec"><h4>Trail</h4><div class="trail">${trail}</div></div>
    <div class="d-sec"><h4>Source</h4><div class="note small">Read from the data lake on the run of 29 Oct 2026. The source record in ${row.areaId==="trd"?"MAVIC":row.areaId==="inv"?"SAP EWM":"SAP S/4HANA"} has not been altered, and the rule version that raised it is in the evidence log.</div></div>`;
  document.getElementById("dAssign").onclick=()=>{
    const o=document.getElementById("dOwner").value,msg=document.getElementById("dMsg");
    msg.classList.remove("hidden");
    if(!o){msg.textContent="Select a process owner, then assign.";msg.style.color="var(--fail)";return}
    row.owner=o;row.status="Assigned";
    const d=document.getElementById("dDue").value;
    row.due=d?new Date(d).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}):"12 Nov 2026";
    row.trail=row.trail.concat([["29 Oct 2026","Assigned for explanation"]]);
    render();openDrawer(key);
    const m2=document.getElementById("dMsg");m2.classList.remove("hidden");
    m2.textContent="Assigned to "+o.split(",")[0]+". Ageing now runs against the due date.";m2.style.color="var(--pass)";
  };
  document.getElementById("dCloseItem").onclick=()=>{
    row.status="Closed";row.trail=row.trail.concat([["29 Oct 2026","Closed by audit, corrective action agreed"]]);
    render();openDrawer(key);
    const m2=document.getElementById("dMsg");m2.classList.remove("hidden");m2.textContent="Item closed. It stays in the trail and the evidence log.";m2.style.color="var(--pass)";
  };
  const dr=document.getElementById("drawer");
  dr.classList.add("on");dr.setAttribute("aria-hidden","false");
  document.getElementById("scrim").classList.add("on");
  document.getElementById("dClose").focus();
}
function shut(){
  const dr=document.getElementById("drawer");
  if(!dr.classList.contains("on")) return;
  dr.classList.remove("on");dr.setAttribute("aria-hidden","true");
  document.getElementById("scrim").classList.remove("on");
  if(lastFocus&&document.body.contains(lastFocus)) lastFocus.focus();
}
document.getElementById("dClose").onclick=shut;
document.getElementById("scrim").onclick=shut;
document.addEventListener("keydown",e=>{if(e.key==="Escape")shut()});
